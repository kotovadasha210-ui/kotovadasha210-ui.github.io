<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Оформление вертикального меню</title>
    <style>
        html {
            background: #f1c7a9;
        }

        .menu {
            width: 300px;
            background: #d4c18d;
        }

        .menu ul {
            list-style: none;
        }

        .menu li a::before {
            width: 16px;
            height: 16px;
            content: "";
            display: inline-block;
            background: url('css_sprites.png') -10px -10px;
        }

        .menu li {
            color: rgb(84, 109, 10);
        }


        .menu li ul {
            padding-bottom: 20px;
        }

        .menu li li a::before {
            background: url('css_sprites.png') -10px -46px;
        }
